# The Kotlin compiler does not fit in Gradle's 512m default; the build daemon OOMs
# with a native allocation failure part-way through :compileKotlin.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
